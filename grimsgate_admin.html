<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<title>Grimsgate – Admin</title>
<style>
  :root {
    --parchment-dark: #2b1d10;
    --ink: #3a2a18;
    --accent: #a8391e;
    --gold: #c9a24b;
  }

  * { box-sizing: border-box; }

  body {
    margin: 0;
    padding: 40px 20px;
    background: #14100b;
    font-family: 'Georgia', 'Times New Roman', serif;
    display: flex;
    flex-direction: column;
    align-items: center;
    min-height: 100vh;
  }

  h1 {
    color: var(--gold);
    letter-spacing: 4px;
    text-transform: uppercase;
    font-size: 26px;
    margin: 0 0 4px 0;
    text-align: center;
  }

  .subtitle {
    color: #8a7a5c;
    font-style: italic;
    font-size: 14px;
    margin-bottom: 30px;
    text-align: center;
  }

  .status {
    font-size: 13px;
    color: #8a7a5c;
    margin-bottom: 24px;
    text-align: center;
  }

  .status.connected { color: #7fa87f; }
  .status.error { color: #c76a5a; }

  .scene-list {
    width: 100%;
    max-width: 480px;
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .scene-btn {
    background: #1a130b;
    border: 2px solid #3a2a18;
    border-radius: 6px;
    padding: 18px 20px;
    color: #cbb98f;
    font-family: inherit;
    font-size: 16px;
    text-align: left;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  .scene-btn:hover {
    border-color: var(--gold);
    background: #221808;
  }

  .scene-btn.active {
    border-color: var(--accent);
    background: #2a1710;
    color: #f4e9d0;
  }

  .scene-btn.active::after {
    content: " ● aktiv";
    color: var(--accent);
    font-size: 12px;
    font-weight: bold;
  }

  .hint {
    margin-top: 30px;
    color: #6b5d45;
    font-size: 12px;
    text-align: center;
    max-width: 480px;
    line-height: 1.6;
  }
</style>
</head>
<body>

  <h1>Grimsgate – Admin</h1>
  <div class="subtitle">Szene auswählen, um sie für alle Spieler live zu setzen</div>
  <div class="status" id="status">Verbinde mit Firebase…</div>

  <div class="scene-list" id="sceneList"></div>

  <div class="hint">
    Änderungen hier wirken sich sofort auf die Spieler-Karte aus (kein Neuladen nötig, sofern dort eine Verbindung besteht).
  </div>

  <!-- Firebase SDK (compat, einfache script-tag Einbindung) -->
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>

  <script src="firebase-config.js"></script>
  <script src="scenes.js"></script>

  <script>
    const statusEl = document.getElementById('status');
    const listEl = document.getElementById('sceneList');
    let currentActive = null;

    function renderButtons() {
      listEl.innerHTML = '';
      Object.keys(SCENES).forEach(function (sceneId) {
        const scene = SCENES[sceneId];
        const btn = document.createElement('button');
        btn.className = 'scene-btn' + (sceneId === currentActive ? ' active' : '');
        btn.textContent = scene.label;
        btn.onclick = function () {
          setScene(sceneId);
        };
        listEl.appendChild(btn);
      });
    }

    let db = null;

    try {
      firebase.initializeApp(firebaseConfig);
      db = firebase.database();

      db.ref('currentScene').on('value', function (snapshot) {
        currentActive = snapshot.val() || DEFAULT_SCENE;
        renderButtons();
        statusEl.textContent = 'Verbunden — aktuelle Szene: ' + (SCENES[currentActive] ? SCENES[currentActive].label : currentActive);
        statusEl.className = 'status connected';
      }, function (err) {
        statusEl.textContent = 'Fehler beim Verbinden: ' + err.message;
        statusEl.className = 'status error';
      });
    } catch (e) {
      statusEl.textContent = 'Firebase-Konfiguration fehlt oder ist fehlerhaft. Bitte firebase-config.js prüfen.';
      statusEl.className = 'status error';
      renderButtons();
    }

    function setScene(sceneId) {
      if (!db) {
        alert('Keine Verbindung zu Firebase — firebase-config.js prüfen.');
        return;
      }
      db.ref('currentScene').set(sceneId);
    }
  </script>

</body>
</html>
